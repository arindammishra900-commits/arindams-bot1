<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arindam's Minecraft Bot Manager</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 320px;
            text-align: center;
        }
        h2 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 25px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            font-size: 12px;
            color: #888;
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: white;
            border-radius: 6px;
            outline: none;
        }
        input:focus {
            border-color: #4CAF50;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover {
            background-color: #45a049;
        }
        #status {
            margin-top: 20px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Arindam's Bot</h2>
        <p>Enter server details to keep it active 24/7</p>
        
        <div class="input-group">
            <label>Server IP / Address</label>
            <input type="text" id="serverIp" placeholder="e.g., play.myserver.com">
        </div>

        <div class="input-group">
            <label>Bot Username</label>
            <input type="text" id="botName" value="ArindamsBot">
        </div>

        <button onclick="deployBot()">Deploy Bot</button>
        <div id="status"></div>
    </div>

    <script>
        async function deployBot() {
            const serverIp = document.getElementById('serverIp').value.trim();
            const botName = document.getElementById('botName').value.trim();
            const statusDiv = document.getElementById('status');

            if (!serverIp) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Please enter a server IP!';
                return;
            }

            statusDiv.style.color = '#f1c40f';
            statusDiv.innerText = 'Deploying bot...';

            try {
                const response = await fetch('/api/start-bot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ serverIp, botName })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.style.color = '#2ecc71';
                    statusDiv.innerText = data.message;
                } else {
                    statusDiv.style.color = '#ff6b6b';
                    statusDiv.innerText = 'Error: ' + data.message;
                }
            } catch (err) {
                statusDiv.style.color = '#ff6b6b';
                statusDiv.innerText = 'Failed to reach the backend server.';
            }
        }
    </script>
</body>
</html>
